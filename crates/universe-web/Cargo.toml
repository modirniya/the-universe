[package]
name = "universe-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser bridge for the-universe: runs a universe in a tab and exposes it for drawing."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
universe-core = { path = "../.." }
# The one dependency this crate needs: it is what turns a Rust function into
# something a browser can call. The core crate is untouched and still has two.
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
