# The claims ledger.
#
# Every claim this repository makes, in one of four categories:
#
#   definition             deliberately built into the model; established by reading the code
#   consequence            follows necessarily from the definitions; established by a derivation
#   computational_finding  could have come out otherwise when the model ran; established by an
#                          experiment with controls, replication and an uncertainty
#   physical_hypothesis    an interpretation concerning our universe; established by nothing here
#
# Ids are <area>-<category>-<nnn>: areas T1..T6 for the theories, DET for detection, GEN for the
# project as a whole; categories DEF, CON, FND, HYP. The README names every id. A finding carries
# the experiment and artifacts it rests on, the seeds, the controls, the commit and design version
# it was last verified at, and one or more [[claim.check]] tables naming an artifact value and the
# range it must stay in. analysis/ledger.py checks all of it; CI runs it on fresh artifacts.
#
# Ranges are loose where a number is an example and tight where it is a count. They exist to catch
# drift between the code and the README, not to pin a decimal.
#
# Status: verified (the checks hold at last_verified_commit), exploratory (the statistic was designed
# after an earlier look at the model and has not yet been replicated on a preregistered seed range),
# stale (the artifacts predate a design change), withdrawn (a v0.9 claim the v1.0 redesign overturned,
# kept so the record shows it), untested (a physical hypothesis).

# ---------------------------------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------------------------------

[[claim]]
id = "GEN-DEF-001"
text = "A seed selects one initial condition (and, under lazy rendering, one set of rendering draws) of one configuration and nothing else. An interval over seeds is an interval over initial conditions, not over sizes, probes, rules or closures."
category = "definition"
module = "stats, experiment"
status = "verified"
source = "src/stats.rs module docs; experiment::ensemble_seeds"

[[claim]]
id = "GEN-FND-001"
text = "The same seed produces the same universe on x86_64 Linux, ARM macOS and wasm32: the golden fingerprint 8151296893090507384 is asserted by the native suite and by the WebAssembly suite, neither seeing the other's answer. The constant moved from 6900610681785451805 at v1.0 when the binomial closure became the reference universe's; the change was deliberate and recorded."
category = "computational_finding"
module = "golden, rng"
experiment = "cargo test --workspace; wasm-pack test --node crates/universe-web"
metric = "World::fingerprint of the reference universe after 64 ticks"
seeds = 1
controls = "two independent targets assert one compiled-in constant"
status = "verified"
verified_by = "tests"
last_verified_commit = "see CI"
design_version = 1

# ---------------------------------------------------------------------------------------------------
# Theory 1: limits as optimizations
# ---------------------------------------------------------------------------------------------------

[[claim]]
id = "T1-DEF-001"
text = "The four limits are toggles on one density-band cellular automaton: discrete space (subdivision 1 vs 2), discrete time (1 vs 2 substeps), the speed cap (radius 1 vs 3) and lazy rendering (unobserved blocks held as a density). 'Relaxing' the speed cap changes the neighbourhood and therefore the law, not only its speed."
category = "definition"
module = "constraints, physics"
status = "verified"
source = "constraints::Resolved; docs/audit.md section 1.3"

[[claim]]
id = "T1-DEF-002"
text = "What stands in for an unobserved block is an assumption of the model, not a consequence of the theory. Three closures are implemented: binomial (the rule averaged over a binomial neighbour count; the default from v1.0), indicator (what v0.1-v0.9 shipped; it saturates a block whose neighbours sit in the birth band) and frozen (the density is held). Every lazy result is reported under each."
category = "definition"
module = "constraints::CoarseRule, physics"
status = "verified"
source = "constraints::CoarseRule docs; docs/derivations.md section 3; docs/audit.md section 1.1"

[[claim]]
id = "T1-CON-001"
text = "The work and memory ratios of the limits are arithmetic on the config: 1/4 for space, 1/2 for time, 1/6 for the speed cap, about 1/4 for lazy rendering at the shipped probe, and about 1/192 = 0.0052 for all four together. Their main effects on log work are exactly additive with zero interaction."
category = "consequence"
module = "constraints, physics, limits"
status = "verified"
derivation = "docs/derivations.md section 1; limits::tests::work_main_effects_are_the_config_arithmetic"
