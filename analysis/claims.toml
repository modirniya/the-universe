[[claim]]
id = "DET-FND-001"
text = "Lazy rendering is findable by an inhabitant whose looking renders. The birth rate at the edge of what it renders, relative to its interior (edge_excess), separates the lazy universe from the fully rendered one with power 19/20 [0.76, 0.99] at a false-positive rate of 1/20 on held-out seeds. The v0.9 claim 'looking conceals lazy rendering' is withdrawn. But the same rule flags the resample control -- fully rendered, unobserved blocks redrawn from their own density -- in 20/20 seeds: what is detected is the approximation at the boundary, not non-computation as such."
category = "computational_finding"
module = "detector"
experiment = "detect --config configs/detect.toml"
artifacts = "detect"
metric = "power and FPR of edge_excess on 20 held-out seeds, rule calibrated on 20 others"
seeds = 40
controls = "two all-limits universes at neighbouring seeds; the resample control"
status = "exploratory"
last_verified_commit = "972145de8c39b2f6d38c726e8908e357bb097f44"
design_version = 2
  [[claim.check]]
  file = "detect/detection.json"
  path = "tests[gaze=looking renders,limit=lazy_rendering,statistic=edge_excess].tpr"
  min = 0.75
  [[claim.check]]
  file = "detect/detection.json"
  path = "tests[gaze=looking renders,limit=lazy_rendering,statistic=edge_excess].fpr"
  max = 0.2
  [[claim.check]]
  file = "detect/detection.json"
  path = "resample[gaze=looking renders,statistic=edge_excess].resample_flagged"
  min = 15

[[claim]]
id = "DET-FND-002"
text = "The negative control is quiet: with H1 replaced by an all-limits universe at the next seed, no statistic reaches power above 0.10 (2/20). The detection machinery does not detect seeds."
category = "computational_finding"
module = "detector"
experiment = "detect --config configs/detect.toml"
artifacts = "detect"
metric = "highest power over statistics and gazes on the negative control"
seeds = 40
controls = "this is the control"
status = "verified"
last_verified_commit = "972145de8c39b2f6d38c726e8908e357bb097f44"
design_version = 2
  [[claim.check]]
  file = "detect/detection.json"
  path = "control_ceiling"
  max = 0.3

[[claim]]
id = "DET-FND-003"
text = "With the honest gaze, discrete space is not reliably found: its best statistic, edge_excess, has power 11/20 [0.34, 0.74] at a false-positive rate of 1/20, and every other statistic is at chance. Because each limit's H0 keeps the other three limits in force, this is the difference discrete space makes in the presence of lazy rendering, not alone."
category = "computational_finding"
module = "detector"
experiment = "detect --config configs/detect.toml"
artifacts = "detect"
metric = "power of edge_excess for discrete_space on held-out seeds"
seeds = 40
controls = "negative control; the other three statistics"
status = "exploratory"
last_verified_commit = "972145de8c39b2f6d38c726e8908e357bb097f44"
design_version = 2
  [[claim.check]]
  file = "detect/detection.json"
  path = "tests[gaze=looking renders,limit=discrete_space,statistic=edge_excess].tpr"
  min = 0.2
  max = 0.85

[[claim]]
id = "DET-FND-004"
text = "The speed cap is also found by texture: the radius-3 rule leaves solid 3x3 patches that Conway does not, so smoothness separates the two with power 20/20 and no false positives. A different law has a different texture; this is a finding about the two laws, not about speed."
category = "computational_finding"
module = "detector"
experiment = "detect --config configs/detect.toml"
artifacts = "detect"
metric = "power of smoothness for speed_cap on held-out seeds"
seeds = 40
controls = "negative control"
status = "verified"
last_verified_commit = "972145de8c39b2f6d38c726e8908e357bb097f44"
design_version = 2
  [[claim.check]]
  file = "detect/detection.json"
  path = "tests[gaze=looking renders,limit=speed_cap,statistic=smoothness].tpr"
  min = 0.9

# ---------------------------------------------------------------------------------------------------
# Theory 5: bootloader life
# ---------------------------------------------------------------------------------------------------

[[claim]]
id = "T5-DEF-001"
text = "A bootloader is a cluster of 3 to 40 live cells tracked by nearest-centroid matching within 3 cells that persists for at least 20 ticks and travels at least 4 cells. Conway's glider is one; a block is not. The thresholds are choices."
category = "definition"
module = "bootloader"
status = "verified"
source = "bootloader::Track::is_bootloader"

[[claim]]
id = "T5-DEF-002"
text = "A child's seed is hashed from what crossed its parent's horizon and from nothing else; bootloaders reach the next layer only through a gate that forbids a sterile layer to seed a child. The gate is the framework's rule. The ablation confirms that gated and ungated chains never differ in a layer both built."
category = "definition"
module = "bootloader::Gate, bootloader::boot_seed"
status = "verified"
source = "bootloader module docs"
artifacts = "boot"
  [[claim.check]]
  file = "boot/gate.csv"
  column = "prefix"
  aggregate = "count_true"
  min = 20
  [[claim.check]]
  file = "boot-permissive/gate.csv"
  column = "prefix"
  aggregate = "count_true"
  min = 20

[[claim]]
id = "T5-FND-001"
text = "The tracker's false-positive floor is small: the same frames in a shuffled order, where nothing travels, yield 0.35 +/- 0.18 bootloaders per thousand cells against 7.3 +/- 0.6 in the real order -- 5% +/- 3% -- and the real count exceeded the shuffled in 20/20 seeds. Bootloader counts are mostly transport, not debris."
category = "computational_finding"
module = "bootloader::shuffle_control"
experiment = "boot --config configs/boot.toml"
artifacts = "boot"
metric = "bootloaders per thousand cells in real and time-shuffled frames"
seeds = 20
controls = "this is the control"
status = "verified"
last_verified_commit = "972145de8c39b2f6d38c726e8908e357bb097f44"
design_version = 2
  [[claim.check]]
  file = "boot/shuffle_control.csv"
  column = "shuffled_per_kilocell"
  aggregate = "mean"
  max = 1.5
  [[claim.check]]
  file = "boot/shuffle_control.csv"
  column = "real_per_kilocell"
  aggregate = "mean"
  min = 4.0

[[claim]]
id = "T5-FND-002"
text = "The v0.9 finding 'poorer layers produce less life (128 -> 32 -> 6 bootloaders)' was area scaling. Per thousand cells the density rises down the chain, 7.3 +/- 0.6 -> 10.8 +/- 1.7 -> 13.0 +/- 4.2, and standalone universes of the same sizes at the root's seed match it (7.3, 10.6, 12.6). The deepest layer's density is below the root's in 1/20 seeds. Withdrawn as a result about degradation."
category = "computational_finding"
module = "bootloader::area_control"
experiment = "boot --config configs/boot.toml"
artifacts = "boot"
metric = "bootloaders per thousand cells by depth, and in standalone universes of the layer's size"
seeds = 20
controls = "standalone universes at the root's seed and at the layer's own seed"
status = "withdrawn"
last_verified_commit = "972145de8c39b2f6d38c726e8908e357bb097f44"
design_version = 2
  [[claim.check]]
  file = "boot/area_control.csv"
  column = "layer_per_kilocell"
  where = { depth = "1" }
  aggregate = "mean"
  max = 9.0
  [[claim.check]]
  file = "boot/area_control.csv"
  column = "layer_per_kilocell"
  where = { depth = "3" }
  aggregate = "mean"
  min = 9.0
  [[claim.check]]
  file = "boot/area_control.csv"
  column = "identical"
  aggregate = "count_true"
  min = 60

[[claim]]
id = "T5-FND-003"
text = "Under the shipped floors the gate never fires: gated and ungated chains are identical in 20/20 seeds and every chain ends on space at depth 3. Under permissive floors (edge 4, 2000 work units) it fires in 16/20 seeds and is the sole stop in 7/20; the rest end on space. In the edge map, sterility alone ends a chain only at fractions of 0.3 or more with a size floor of 8 or less, in at most 2 of 10 seeds per cell, and is never the commonest ending anywhere."
category = "computational_finding"
module = "bootloader"
experiment = "boot --config configs/boot.toml; boot --config configs/boot-permissive.toml; edge --config configs/edge.toml"
artifacts = "boot"
metric = "gate fired, sole stop, and the ending per cell of the fraction x floor map"
seeds = 20
controls = "the gate ablation (Gate::Open) at every setting"
status = "verified"
last_verified_commit = "972145de8c39b2f6d38c726e8908e357bb097f44"
design_version = 2
  [[claim.check]]
  file = "boot/gate.csv"
  column = "gate_fired"
  aggregate = "count_true"
  equals = 0
  [[claim.check]]
  file = "boot-permissive/gate.csv"
  column = "gate_fired"
  aggregate = "count_true"
  min = 8
  [[claim.check]]
  file = "edge/edge.csv"
  column = "ending"
  where = { ending = "sterile" }
  aggregate = "count"
  min = 1

[[claim]]
id = "T5-HYP-001"
text = "The cosmic role of emergent agents is to boot the next layer: life's structural function in a chain of simulations is to instantiate the layer below."
category = "physical_hypothesis"
module = "docs/philosophy.md section 5"
status = "untested"

# ---------------------------------------------------------------------------------------------------
# Theory 6: fine-tuning
# ---------------------------------------------------------------------------------------------------

[[claim]]
id = "T6-DEF-001"
text = "'Complex' is one of three criteria, each a band on a statistic: resemblance to Conway within a factor of four on activity and dispersion; compressibility between 0.2 and 0.8 of noise; perturbation growth between 0 and 0.5. All three are choices, and the activity band was changed after a chaotic rule passed a floor. The work is exploratory in that sense."
category = "definition"
module = "sweep::Criterion"
status = "verified"
source = "sweep module docs; docs/audit.md section 5.2"

[[claim]]
id = "T6-CON-001"
text = "A radius-1 neighbourhood has densities k/8 only, so the 21 x 21 grid of band centres denotes 42 distinct laws at Conway's half-widths and 289 with the half-widths swept; the band form can state 46 x 46 = 2116 laws in all, and the outer-totalistic family it cannot state has 2^18."
category = "consequence"
module = "sweep::rule_signature, measure::band_laws"
status = "verified"
derivation = "measure::tests::the_band_family_has_forty_six_squared_laws_all_distinct"

[[claim]]
id = "T6-FND-001"
text = "In the baseline universe (64x64, 80 ticks, density 0.30) productive laws are a minority under every prior and every criterion, in every seed. Across 20 seeds the lowest share is 0.055 +/- 0.035 (all band laws, Conway bar) and the highest 0.446 +/- 0.037 (all band laws, perturbation growth); the life-like sample gives 0.09 to 0.17. 'In the baseline universe' is load-bearing: see T6-FND-003."
category = "computational_finding"
module = "measure"
experiment = "measure --config configs/measure.toml"
artifacts = "measure"
metric = "share of laws admitted, five priors x three criteria"
seeds = 20
controls = "five priors as the control on the measure; the same life-like sample at every seed"
status = "verified"
last_verified_commit = "972145de8c39b2f6d38c726e8908e357bb097f44"
design_version = 1
  [[claim.check]]
  file = "measure/measure.json"
  path = "highest_share.mean"
  max = 0.5
  min = 0.3
  [[claim.check]]
  file = "measure/measure.json"
  path = "lowest_share.mean"
  max = 0.15

[[claim]]
id = "T6-FND-002"
text = "The productive share is a property of the prior and the criterion as much as of the laws: it spans a factor of about eight (0.055 to 0.446) depending on how laws are counted and what counts as complex. Nothing in the model privileges one prior. 'Fine-tuning is X%' has no meaning here without naming both."
category = "computational_finding"
module = "measure"
experiment = "measure --config configs/measure.toml"
artifacts = "measure"
metric = "range of the share over priors and criteria"
seeds = 20
controls = "five priors, three criteria"
status = "verified"
last_verified_commit = "972145de8c39b2f6d38c726e8908e357bb097f44"
design_version = 1
  [[claim.check]]
  file = "measure/measure.json"
  path = "shares[prior=all band laws,criterion=resembles conway].share.mean"
  max = 0.15
  [[claim.check]]
  file = "measure/measure.json"
  path = "shares[prior=all band laws,criterion=perturbation growth].share.mean"
  min = 0.3

[[claim]]
id = "T6-FND-003"
text = "The productive share also depends on the universe the laws are tried in. Scoring the band family at other sizes, durations and densities (three seeds each): under the compressibility criterion the share stays at 0.32-0.33 everywhere; under the Conway bar it runs from 0.02 (160 ticks) to 0.19 (40 ticks); under perturbation growth from 0.36 (edge 32) to 0.60 (edge 96) and 0.63 (40 ticks) -- a MAJORITY in two of the six settings. Conway itself fails the growth criterion in every seed at edge 32 and at 160 ticks. 'Fine-tuning' under that criterion is a statement about a world size and a run length."
category = "computational_finding"
module = "measure"
experiment = "measure --config configs/measure.toml"
artifacts = "measure"
metric = "share of the 2116 band laws admitted, per setting and criterion"
seeds = 3
controls = "the baseline setting; the three criteria; whether Conway passes"
status = "verified"
last_verified_commit = "972145de8c39b2f6d38c726e8908e357bb097f44"
design_version = 1
  [[claim.check]]
  file = "measure/measure_sensitivity.csv"
  column = "fraction"
  where = { setting = "ticks 40", criterion = "perturbation growth" }
  aggregate = "mean"
  min = 0.5
  [[claim.check]]
  file = "measure/measure_sensitivity.csv"
  column = "fraction"
  where = { setting = "edge 96", criterion = "perturbation growth" }
  aggregate = "mean"
  min = 0.5
  [[claim.check]]
  file = "measure/measure_sensitivity.csv"
  column = "fraction"
  where = { setting = "ticks 160", criterion = "compressibility" }
  aggregate = "mean"
  min = 0.28
  max = 0.38
  [[claim.check]]
  file = "measure/measure_sensitivity.csv"
  column = "fraction"
  where = { setting = "ticks 160", criterion = "resembles conway" }
  aggregate = "mean"
  max = 0.1

[[claim]]
id = "T6-HYP-001"
text = "Only narrow bands of a universe's constants produce complexity, and ours sits in one."
category = "physical_hypothesis"
module = "docs/philosophy.md section 6"
status = "untested"
