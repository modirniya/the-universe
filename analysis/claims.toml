# ---------------------------------------------------------------------------------------------------
# Theory 2: nesting and degradation
# ---------------------------------------------------------------------------------------------------

[[claim]]
id = "T2-CON-001"
text = "A chain in which each child receives a fraction f of its parent's budget is finite: the deepest viable layer is 1 + floor(log(root/viable_work) / log(1/f)), and the whole chain costs under root / (1 - f), which is 4/3 of the root at f = 1/4. Integer flooring makes the depth a bound, not an equality. The shipped chain builds 3 layers against a closed form of 4."
category = "consequence"
module = "budget, layer"
status = "verified"
derivation = "docs/derivations.md section 2; budget::tests"
artifacts = "nesting"
  [[claim.check]]
  file = "nesting/chain.csv"
  column = "depth"
  aggregate = "count"
  min = 3
  max = 4

[[claim]]
id = "T2-CON-002"
text = "Cost is not monotone in world size, because lazy rendering charges by the block and the rescaled probe lands on block boundaries differently at each size. A chain can therefore end on block quantisation -- a world above the size floor would fit by area but none fits by block -- as well as on budget or on space. The termination map computes which binds where, over fractions, floors, block sizes and root sizes, without running any physics."
category = "consequence"
module = "layer::map_terminations"
status = "verified"
derivation = "docs/derivations.md section 2; layer::tests::cost_is_not_monotonic_in_world_size"
artifacts = "nesting"
  [[claim.check]]
  file = "nesting/terminations.csv"
  column = "ending"
  where = { ending = "quantisation" }
  aggregate = "count"
  min = 1
  [[claim.check]]
  file = "nesting/terminations.csv"
  column = "ending"
  where = { ending = "budget" }
  aggregate = "count"
  min = 1

[[claim]]
id = "T2-CON-003"
text = "A layer of the chain is a standalone universe of its size, seed and probe: nothing about its host reaches it. The size control reproduces every layer's churn and work exactly. Any trend down a chain is a trend in world size, and 'degradation signature' is the wrong name for it."
category = "consequence"
module = "layer::size_control"
status = "verified"
derivation = "layer::run_chain calls experiment::run on a smaller config; layer::tests::a_layer_is_a_standalone_universe_of_its_size"
artifacts = "nesting"
  [[claim.check]]
  file = "nesting/size_control.json"
  path = "[0].identical"
  equals = true

[[claim]]
id = "T2-FND-001"
text = "The v0.9 finding 'the deepest layer is calmer than the root in 20/20 seeds' held under the indicator closure and holds in 0/20 under the binomial one: churn is 0.0053 at depth 1, 0.0062 at depth 2 and 0.0162 at depth 3. Churn tracks the share of blocks the rescaled probe resolves (0.25 at edges 21, 64 and 128; 1.00 at 16, 24, 32, 48), not depth. Withdrawn as a result about nesting."
category = "computational_finding"
module = "layer"
experiment = "nest --config configs/nesting.toml"
artifacts = "nesting"
metric = "mean tick-to-tick macro churn per layer; churn against size for standalone universes"
seeds = 20
controls = "standalone universes at every edge the chain could choose, with the resolved share recorded"
status = "withdrawn"
last_verified_commit = "972145de8c39b2f6d38c726e8908e357bb097f44"
design_version = 2
  [[claim.check]]
  file = "nesting/ensemble.csv"
  column = "churn"
  where = { depth = "3" }
  aggregate = "mean"
  min = 0.010
  [[claim.check]]
  file = "nesting/ensemble.csv"
  column = "churn"
  where = { depth = "1" }
  aggregate = "mean"
  max = 0.008

# ---------------------------------------------------------------------------------------------------
# Theory 3: the horizon as a serializing pipe
# ---------------------------------------------------------------------------------------------------

[[claim]]
id = "T3-DEF-001"
text = "A message is a magnitude (the horizon's occupancy) and a position-sensitive hash, in a channel of a stated width; the child holds a WriteEnd with write and seal and nothing else, and no conversion leads back from the ReadEnd. That magnitude and timing cross and arrangement does not is how the message was built. The horizon is a rectangle of cells; the module models no black hole."
category = "definition"
module = "pipe"
status = "verified"
source = "pipe::Message, pipe::WriteEnd, pipe::ReadEnd"

[[claim]]
id = "T3-CON-001"
text = "The hash carries no information about occupancy: hash:6 against horizon_now reads 0.00 +/- 0.05 bits of corrected mutual information, and one changed cell flips about half the digest's bits. Both are properties of hashing, checked so that the fold is known to be a hash."
category = "consequence"
module = "pipe, information"
status = "verified"
derivation = "docs/derivations.md section 5"
artifacts = "pipe"
  [[claim.check]]
  file = "pipe/information.json"
  path = "rows[encoding=hash:6,task=horizon_now].measure.mi_corrected"
  min = -0.2
  max = 0.2
  [[claim.check]]
  file = "pipe/pipe.json"
  path = "content_avalanche"
  min = 0.4
  max = 0.6

[[claim]]
id = "T3-FND-001"
text = "At full width the shipped encoding carries 1.44 +/- 0.19 bits per tick about the horizon's own occupancy (of an input entropy of 2.0 +/- 0.2 at 64 levels and a target entropy of 3.0), 0.48 +/- 0.23 about the whole child's occupancy now, 0.32 +/- 0.20 about it ten ticks ahead, 0.22 +/- 0.17 about which quadrant of the horizon is densest, and 0.75 +/- 0.16 about the four-quadrant pattern. The leave-one-out predictive information is within 0.1 bit of each."
