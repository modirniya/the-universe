[[claim]]
id = "T4-DEF-001"
text = "A child cannot learn that it is read: WriteEnd exposes no method returning anything about the far side. A parent sees only what clears the logging threshold (ReadEnd::above). Both are types, not measurements."
category = "definition"
module = "pipe"
status = "verified"
source = "pipe::WriteEnd, pipe::ReadEnd::above"

[[claim]]
id = "T4-HYP-001"
text = "A creator may be unaware of or indifferent to its inhabitants: watching a dashboard whose resolution does not include them."
category = "physical_hypothesis"
module = "docs/philosophy.md section 4"
status = "untested"

