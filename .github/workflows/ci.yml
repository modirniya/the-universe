# Uses only first-party actions and the toolchain preinstalled on GitHub
# runners. The project's ground rule about resisting dependencies applies to
# CI too: fewer third-party actions is less to audit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: cargo --version && rustc --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

  claims:
    name: the ledger's claims still hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      # "Benchmarks are claims": every number the README quotes is produced by
      # a command in this repository, recorded in analysis/claims.toml with
      # the artifact it came from and a range it must stay in, and checked
      # here from a fresh run. Wall time is never asserted on: it is a
      # measurement, not a counter, and a shared runner is the worst place to
      # take one.
      #
      # The ledger's `last_verified_commit` is the commit the committed
      # artifacts came from; this job regenerates them at HEAD, so it checks
      # the ranges and not the commit (--ignore-commit). A ledger whose ranges
      # fail here means the code and the README have drifted apart.
      - name: The ledger is well formed and the README names every claim
        run: python3 analysis/ledger.py --no-artifacts

      - name: Reproduce every published table
        run: scripts/reproduce.sh

      - name: Every artifact carries its provenance
        run: |
          for d in out out/nesting out/pipe out/detect out/sweep out/boot out/boot-permissive out/edge out/measure; do
            test -s "$d/metadata.json" || { echo "missing $d/metadata.json"; exit 1; }
          done
          python3 - <<'PY'
          import json, glob
          for p in sorted(glob.glob("out/**/metadata.json", recursive=True)):
              m = json.load(open(p))
              print(f"{p}: {m['command']} v{m['experiment_version']} at {m['commit'][:12]} dirty={m['dirty']}")
              assert m["dirty"] is False, f"{p}: built from a dirty tree"
          PY

      - name: The ledger's ranges hold on the fresh artifacts
        run: python3 analysis/ledger.py --ignore-commit

      # Invariants that are true by construction and should never move, kept
      # here as a cheap tripwire independent of the ledger.
      - name: Invariants that follow from the definitions still hold
        run: |
          python3 - <<'PY'
          import csv, json, sys
          fail = []

          # Theory 1: every limit lowers work; the reference is at zero distance.
          rows = {r["label"]: r for r in csv.DictReader(open("out/factorial.csv")) if r["kind"] == "factorial"}
          for label, r in rows.items():
              if label != "all_off" and float(r["work_ratio"]) >= 1.0:
                  fail.append(f"{label}: work_ratio not below 1")
          if float(rows["all_off"]["div_half"]) != 0.0:
              fail.append("the reference diverges from itself")
          if float(rows["all_on"]["work_ratio"]) > 0.01:
              fail.append("all_on lost its arithmetic saving")

          # Nesting: budgets fall, prediction is exact, the size control is a tautology.
          layers = list(csv.DictReader(open("out/nesting/chain.csv")))
          for a, b in zip(layers, layers[1:]):
              if int(b["budget_work"]) >= int(a["budget_work"]):
                  fail.append("a layer was not poorer than its host")
          for r in layers:
              if r["predicted_work"] != r["spent_work"] or r["within_budget"] != "true":
                  fail.append(f"layer {r['depth']}: prediction inexact or budget exceeded")
          for row in json.load(open("out/nesting/size_control.json")):
              if not row["identical"]:
                  fail.append(f"size control differed at depth {row['depth']}")

          # Detection: consequences are exact; the negative control is quiet.
          d = json.load(open("out/detect/detection.json"))
          for t in d["tests"]:
              if t["limit"] in ("speed_cap", "discrete_time") and t["statistic"] == "influence_speed" and t["gaze"] == "looking renders":
                  if t["tpr"] != 1.0:
                      fail.append(f"{t['limit']}: capped reach should be found with full power")
          if d["control_ceiling"] > 0.3:
              fail.append(f"negative control reached power {d['control_ceiling']}")

          # Pipe: the hash carries nothing about occupancy; random symbols carry nothing.
          info = json.load(open("out/pipe/information.json"))
          for r in info["rows"]:
              if r["encoding"].startswith("hash") and r["task"] == "horizon_now" and abs(r["measure"]["mi_corrected"]) > 0.15:
                  fail.append(f"{r['encoding']} carried {r['measure']['mi_corrected']} bits about occupancy")
          if abs(info["noise_control"]["mi_corrected"]) > 0.15:
              fail.append("random symbols carried information")

          # Bootloaders: the gate never changes a shared layer; the shuffle floor is below the real count.
          for path in ("out/boot/gate.csv", "out/boot-permissive/gate.csv"):
              for r in csv.DictReader(open(path)):
                  if r["prefix"] != "true":
                      fail.append(f"{path}: a gated chain differed from the ungated one in a shared layer")
          for r in csv.DictReader(open("out/boot/shuffle_control.csv")):
              if float(r["shuffled_per_kilocell"]) >= float(r["real_per_kilocell"]):
                  fail.append(f"seed {r['seed']}: shuffled frames out-scored real ones")

          if fail:
              print("FAILED:", *fail, sep="\n  ")
              sys.exit(1)
          print("the invariants hold")
          PY

  wasm:
    name: same seed, same universe -- on WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/wasm-pack
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            cargo install wasm-pack --locked
          fi
          wasm-pack --version

      # Determinism is the project's first rule, and until v0.7 it was only ever
      # checked on one architecture. The native suite asserts a fingerprint for a
      # fixed reference universe; this asserts the same constant after compiling
      # the same code to a different target. Neither sees the other's answer.
      - name: The fingerprint agrees across targets
        run: wasm-pack test --node crates/universe-web

  macos:
    name: builds on the target hardware
    # The stated target is a MacBook Air M1, and macos-latest is ARM64.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: cargo test --workspace --all-targets
