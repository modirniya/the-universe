# Uses only first-party actions and the toolchain preinstalled on GitHub
# runners. The project's ground rule about resisting dependencies applies to
# CI too: fewer third-party actions is less to audit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: cargo --version && rustc --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

  claims:
    name: the README's claims still hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      # "Benchmarks are claims: every performance statement in the README must
      # be reproducible by a command in the repo." This job runs that exact
      # command and checks the reproducible part of what the README says about
      # it. Wall time is deliberately not asserted on -- it is a measurement,
      # not a counter, and a shared CI runner is the worst place to measure it.
      - name: Run the documented experiment
        run: cargo run --release -- run --config configs/default.toml

      - name: Run the documented nesting chain
        run: cargo run --release -- nest --config configs/nesting.toml

      - name: Run the documented pipe relay
        run: cargo run --release -- pipe --config configs/pipe.toml

      - name: Run the documented detection survey
        run: cargo run --release -- detect --config configs/detect.toml

      - name: Run the documented fine-tuning sweep
        run: cargo run --release -- sweep --config configs/sweep.toml --steps 11

      - name: Run the documented boot chain
        run: cargo run --release -- boot --config configs/boot.toml

      - name: Artifacts were written
        run: |
          test -s out/runs.csv && test -s out/report.json
          test -s out/nesting/chain.csv && test -s out/nesting/chain.json
          test -s out/pipe/pipe.csv && test -s out/pipe/pipe.json
          test -s out/detect/detection.csv && test -s out/detect/detection.json
          test -s out/sweep/sweep.csv && test -s out/sweep/sweep.json
          test -s out/boot/boot.csv && test -s out/boot/boot.json

      - name: Constraints reduce work, and the control is non-degenerate
        run: |
          python3 - <<'PY'
          import csv, sys

          rows = {r["label"]: r for r in csv.DictReader(open("out/runs.csv"))}
          fail = []

          # Every limit must cost less work than the unconstrained reference.
          for label, row in rows.items():
              if label == "all_off":
                  continue
              w = float(row["work_ratio"])
              if w >= 1.0:
                  fail.append(f"{label}: work_ratio {w:.4f} is not below 1")

          # The headline: all limits together are dramatically cheaper.
          all_on = float(rows["all_on"]["work_ratio"])
          if all_on > 0.05:
              fail.append(f"all_on: work_ratio {all_on:.4f} lost the ~190x saving")

          # The reference must diverge from itself by exactly nothing.
          if float(rows["all_off"]["mean_divergence"]) != 0.0:
              fail.append("all_off diverges from itself")

          print(f"{len(rows)} runs checked")
          for label, row in rows.items():
              print(f"  {label:<8} work {float(row['work_ratio']):.4f}  "
                    f"div {float(row['mean_divergence']):.5f}")

          if fail:
              print("\nFAILED:", *fail, sep="\n  ")
              sys.exit(1)
          print("\nthe README's reproducible claims hold")
          PY

      - name: Nesting invariants hold
        run: |
          python3 - <<'PY'
          import csv, sys

          rows = list(csv.DictReader(open("out/nesting/chain.csv")))
          fail = []

          if len(rows) < 3:
              fail.append(f"expected at least 3 layers, got {len(rows)}")

          for r in rows:
              if r["within_budget"] != "true":
                  fail.append(f"layer {r['depth']} outspent its host")
              # predict_work is exact, not an estimate -- see layer.rs
              if r["predicted_work"] != r["spent_work"]:
                  fail.append(
                      f"layer {r['depth']}: predicted {r['predicted_work']} "
                      f"but spent {r['spent_work']}"
                  )

          for a, b in zip(rows, rows[1:]):
              if int(b["budget_work"]) >= int(a["budget_work"]):
                  fail.append(f"layer {b['depth']} was not poorer than layer {a['depth']}")
              if int(b["height"]) > int(a["height"]):
                  fail.append(f"layer {b['depth']} was larger than its host")

          print(f"{len(rows)} layers checked")
          for r in rows:
              print(f"  depth {r['depth']}: {r['width']}x{r['height']}  "
                    f"budget {r['budget_work']}  churn {float(r['churn']):.5f}")

          if fail:
              print("\nFAILED:", *fail, sep="\n  ")
              sys.exit(1)
          print("\nnesting invariants hold")
          PY

      - name: Pipe claims hold
        run: |
          python3 - <<'PY'
          import csv, json, sys

          d = json.load(open("out/pipe/pipe.json"))
          rows = list(csv.DictReader(open("out/pipe/pipe.csv")))
          fail = []

          # Theory 3 has two halves and they pull opposite ways.
          av = d["content_avalanche"]
          if not 0.35 <= av <= 0.65:
              fail.append(f"content avalanche {av:.3f} is outside [0.35, 0.65]")

          corr = d["magnitude_correlation"]
          if corr < 0.5:
              fail.append(f"magnitude correlation {corr:.3f} fell below 0.5")

          if d["compression_ratio"] >= 0.10:
              fail.append(f"channel carries {d['compression_ratio']:.3f}, too wide to be a bottleneck")

          # Raising the threshold must never reveal more.
          vis = [float(r["visible_fraction"]) for r in rows]
          for a, b in zip(vis, vis[1:]):
              if b > a:
                  fail.append("a higher threshold showed more of the child")

          # No correlation may be reported from too few events.
          for r in rows:
              if int(r["samples"]) < 5 and r["correlation"] != "NaN":
                  fail.append(
                      f"threshold {r['threshold']} reported {r['correlation']} "
                      f"from {r['samples']} events"
                  )

          print(f"avalanche {av:.3f}  correlation {corr:.3f}  "
                f"channel {d['compression_ratio']*100:.2f}%")
          for r in rows:
              print(f"  threshold {r['threshold']}: {float(r['visible_fraction'])*100:5.1f}% "
                    f"over {r['samples']:>4} events")

          if fail:
              print("\nFAILED:", *fail, sep="\n  ")
              sys.exit(1)
          print("\npipe claims hold")
          PY

      - name: Detection findings hold
        run: |
          python3 - <<'PY'
          import csv, sys

          rows = list(csv.DictReader(open("out/detect/detection.csv")))
          honest = [r for r in rows if r["gaze"] == "looking renders"]
          passive = [r for r in rows if r["gaze"] == "reads without rendering"]
          fail = []

          def verdict(rows, limit):
              hit = [r for r in rows if r["limit"] == limit]
              if not hit:
                  fail.append(f"{limit} missing from the survey")
                  return None
              return hit[0]["detectable"] == "true"

          # The cell is the ruler.
          if verdict(honest, "discrete_space"):
              fail.append("discrete_space should leave no fingerprint")
          # The speed of influence is measurable.
          if not verdict(honest, "speed_cap"):
              fail.append("speed_cap should be findable from inside")
          # Looking is what conceals lazy rendering: invisible when the
          # inhabitant renders, visible to a passive reader.
          if verdict(honest, "lazy_rendering"):
              fail.append("lazy_rendering should be concealed by the act of looking")
          if not verdict(passive, "lazy_rendering"):
              fail.append("lazy_rendering should be visible to a passive reader")

          for r in rows:
              print(f"  {r['gaze']:<24} {r['limit']:<16} {r['signal']:<16} "
                    f"{r['with_limit']:>8} vs {r['without_limit']:>8}  {r['detectable']}")

          if fail:
              print("\nFAILED:", *fail, sep="\n  ")
              sys.exit(1)
          print("\ndetection findings hold")
          PY

      - name: Fine-tuning claims hold
        run: |
          python3 - <<'PY'
          import json, sys

          d = json.load(open("out/sweep/sweep.json"))
          fail = []

          # If the reference fails its own calibration nothing else means anything.
          if not d["reference_admitted"]:
              fail.append("the reference setting failed the bar it set")

          # Theory 6 needs the productive band to be a minority, and the count
          # must be over distinct laws rather than grid area.
          rf = d["productive_rule_fraction"]
          if not 0.0 < rf < 0.5:
              fail.append(f"productive rule fraction {rf:.3f} is outside (0, 0.5)")

          if d["distinct_rules"] >= len(d["grid"]):
              fail.append("the grid should collapse onto fewer distinct laws")

          # Chaos must not be counted: nothing admitted may exceed the activity band.
          for o in d["grid"]:
              if o["complex"] and o["activity"] > d["bar"]["max_activity"]:
                  fail.append(f"a chaotic setting was admitted: activity {o['activity']}")
                  break

          print(f"{d['distinct_complex']} of {d['distinct_rules']} distinct laws productive "
                f"({rf*100:.1f}%), over {len(d['grid'])} settings")

          if fail:
              print("\nFAILED:", *fail, sep="\n  ")
              sys.exit(1)
          print("\nfine-tuning claims hold")
          PY

      - name: Bootloader claims hold
        run: |
          python3 - <<'PY'
          import json, sys

          d = json.load(open("out/boot/boot.json"))
          layers = d["layers"]
          fail = []

          if d["depth"] < 2:
              fail.append(f"the chain reached only depth {d['depth']}")

          root = layers[0]
          if root["bootloaders"] < 1:
              fail.append("the root universe produced no bootloader")
          if not root["booted_child"]:
              fail.append("the root should have seeded a child")

          # Every child is seeded by its parent, and no two share a seed.
          seeds = [l["seed"] for l in layers]
          if len(set(seeds)) != len(seeds):
              fail.append("two layers shared a seed")

          # Degradation thins out life as well as budget.
          if layers[-1]["bootloaders"] > root["bootloaders"]:
              fail.append("the deepest layer out-booted the first")

          # Rust folds float sums from -0.0; a report must not print it.
          for l in layers:
              if str(l["transport"]).startswith("-"):
                  fail.append(f"layer {l['depth']} reported negative transport")

          for l in layers:
              print(f"  depth {l['depth']}: {l['width']}x{l['height']}  "
                    f"boots {l['bootloaders']:>4}  transport {l['transport']:>9.1f}  "
                    f"child {l['booted_child']}")
          print(f"ended: {d['ended_because']}")

          if fail:
              print("\nFAILED:", *fail, sep="\n  ")
              sys.exit(1)
          print("\nbootloader claims hold")
          PY

  wasm:
    name: same seed, same universe -- on WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/wasm-pack
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            cargo install wasm-pack --locked
          fi
          wasm-pack --version

      # Determinism is the project's first rule, and until v0.7 it was only ever
      # checked on one architecture. The native suite asserts a fingerprint for a
      # fixed reference universe; this asserts the same constant after compiling
      # the same code to a different target. Neither sees the other's answer.
      - name: The fingerprint agrees across targets
        run: wasm-pack test --node crates/universe-web

  macos:
    name: builds on the target hardware
    # The stated target is a MacBook Air M1, and macos-latest is ARM64.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: cargo test --workspace --all-targets
