# Theory 3: the horizon as a serializing pipe.
#
# A child universe writes one message per tick through its horizon. The
# question is what a parent on the far side can recover, and for which task:
# the amount, the moment, the arrangement, the future. The analysis measures
# it in bits, per encoding, against a window elsewhere and against noise.
# Nothing here models a black hole; see docs/philosophy.md for the analogy.

[world]
width = 128
height = 128
ticks = 300
seed = 42
seeds = 20           # an ensemble: seed 42 is the pinned example, 19 more make it a finding
seed_stride = 1000   # seeds 42, 1042, 2042, ...; must exceed 1, the control runs at seed + 1
init_density = 0.30

[params]
subdivision = 2
substeps = 2
capped_radius = 1
uncapped_radius = 3
block_size = 16
coarse_rule = "binomial"  # what stands in for unobserved ground: binomial (mean field), indicator (v0.9), or frozen

[observer]
x = 32
y = 32
width = 64
height = 64

# The write surface. Placed to straddle the observed region (32..96) and the
# coarse ground outside it, because what crosses a pipe is subject to the
# child's own optimizations and pretending otherwise would flatter the model.
# (v0.9 placed it at 48, wholly inside the observed region, while saying this.)
[horizon]
x = 64
y = 64
width = 48
height = 48
bits = 128   # channel width per tick: an exact magnitude plus a 64-bit digest.
             # The relay also reads the same child at 1..64 bits regardless.

[report]
macro_grid = 16
out_dir = "out/pipe"
