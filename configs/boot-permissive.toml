# Theory 5 with permissive floors: a chain that can die of sterility.
#
# Every layer is seeded by what crossed its parent's horizon. Emergent
# structures drive the activity, the activity is what crosses, and what crosses
# is all the child ever receives. Neither end can see through the pipe, and the
# child is booted anyway.
#
# The chain can end for want of budget or for want of anything alive enough to
# boot with. Which comes first is not decided here.
#
# This is configs/boot.toml with the floors in [nesting] lowered, so worlds as
# small as 4 cells a side are viable. Under these floors the chain runs until a
# layer is too small to grow anything that travels: it dies of sterility, with
# budget still in hand. It is also where the bootloader gate is tested, since
# the shipped floors stop every chain before the gate is ever reached.

[world]
width = 128
height = 128
ticks = 200
seed = 42
seeds = 20           # an ensemble: seed 42 is the pinned example, 19 more make it a finding
seed_stride = 1000   # seeds 42, 1042, 2042, ...; must exceed 1, the control runs at seed + 1
init_density = 0.30

[params]
subdivision = 2
substeps = 2
capped_radius = 1
uncapped_radius = 3
block_size = 16

[observer]
x = 16
y = 16
width = 96
height = 96

[horizon]
x = 32
y = 32
width = 48
height = 48
# Below this magnitude a parent notices nothing at all.
threshold = 0.05

[nesting]
fraction = 0.25
viable_work = 2000   # permissive: see the header
viable_edge = 4

[report]
macro_grid = 16
out_dir = "out/boot-permissive"
